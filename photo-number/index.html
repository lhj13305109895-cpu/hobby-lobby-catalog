<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fc">
  <meta name="description" content="在手机上批量为照片写入货号，按 318、319、322 分别续号。">
  <meta name="robots" content="noindex, nofollow">
  <title>照片货号</title>
  <link rel="stylesheet" href="../src/photo-number/style.css">
  <script type="module" src="../src/photo-number/app.mjs"></script>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>照片货号</h1>
      <p>批量添加货号，三个系列分别续号。</p>
    </div>
    <a href="/admin/" id="admin-link" hidden>管理后台</a>
  </header>

  <section class="card settings" aria-labelledby="settings-title">
    <h2 id="settings-title">设置编号</h2>
    <div class="fields">
      <fieldset>
        <legend>货号系列</legend>
        <div class="segments">
          <label><input type="radio" name="prefix" value="318"><span>318</span></label>
          <label><input type="radio" name="prefix" value="319" checked><span>319</span></label>
          <label><input type="radio" name="prefix" value="322"><span>322</span></label>
        </div>
      </fieldset>
      <label class="field">起始尾号
        <input id="start" type="text" inputmode="numeric" maxlength="24" autocomplete="off" value="1" aria-describedby="memory">
      </label>
      <p id="memory" class="memory" aria-live="polite"></p>
      <label class="field">写入位置
        <select id="corner"><option value="right">右下角</option><option value="left">左下角</option><option value="top-left">左上角</option><option value="top-right">右上角</option><option value="center">正中央</option><option value="custom">自定义位置</option></select>
      </label>
      <label class="field">照片排序
        <select id="order"><option value="name">文件名</option><option value="selected">选取顺序</option><option value="modified">最早修改在前</option></select>
      </label>
      <label class="field size-field"><span>字号 <output id="size-value" for="size">100%</output></span>
        <input id="size" type="range" min="50" max="250" step="5" value="100">
      </label>
      <div class="coordinates" id="coordinates" hidden>
        <label class="field"><span>横向 <output id="x-value" for="x">50%</output></span><input id="x" type="range" min="0" max="100" value="50"></label>
        <label class="field"><span>纵向 <output id="y-value" for="y">50%</output></span><input id="y" type="range" min="0" max="100" value="50"></label>
      </div>
      <label class="field">导出格式
        <select id="format"><option value="auto">高清（保留 PNG）</option><option value="png">PNG 无损</option></select>
      </label>
      <label class="field">导出尺寸
        <select id="resolution"><option value="original">原始尺寸</option><option value="compatible">最长边 4096 像素</option></select>
      </label>
    </div>
  </section>

  <section class="card photos" aria-labelledby="photos-title">
    <div class="section-head">
      <div><h2 id="photos-title">导入照片</h2><p id="count">还没选照片</p></div>
      <button type="button" id="clear" class="secondary compact" disabled>清空</button>
    </div>
    <div id="dropzone" class="dropzone">
      <button type="button" class="primary" id="choose">选择照片</button>
      <input type="file" id="files" accept="image/*,.heic,.heif" multiple hidden>
      <p>可一次多选，也能分批继续添加</p>
    </div>
    <div class="photo-work" id="photo-work" hidden>
      <ul id="plan" class="plan" aria-label="照片编号预览"></ul>
      <figure id="sample" hidden>
        <div id="sample-stage" class="sample-stage"><img id="sample-image" alt="写入货号后的样图" draggable="false"></div>
        <figcaption id="sample-caption"></figcaption>
      </figure>
    </div>
  </section>

  <section class="card save" aria-label="处理和下载">
    <p id="status" class="status" role="status">选好照片后可以预览编号。</p>
    <div class="save-buttons">
      <button type="button" class="primary" id="process" disabled>批量添加货号</button>
      <a class="primary download" id="download" hidden>下载成品 ZIP</a>
    </div>
    <p id="save-note" class="hint">照片在浏览器里处理。成品和编号记录打包下载。</p>
  </section>
</main>
</body>
</html>
